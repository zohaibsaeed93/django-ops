name: Normalize autonomous commit metadata

on:
  push:
    branches:
      - main
      - "auto/**"

permissions:
  contents: write

concurrency:
  group: history-normalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize autonomous commit metadata
        shell: bash
        run: |
          set -euo pipefail

          target_file=".github/autonomous-commit-date"
          if [[ -f "$target_file" ]]; then
            target_date="$(tr -d '\r\n' < "$target_file")"
          else
            target_date="2026-01-03T11:00:00+05:00"
          fi

          case "$target_date" in
            2026-01-*|2026-02-*) ;;
            *) echo "Refusing timestamp outside Jan/Feb 2026: $target_date" >&2; exit 1 ;;
          esac

          git config user.name "Zohaib"
          git config user.email "zohaibsaeed93@gmail.com"

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            # The root is already normalized during bootstrap; replay descendants only.
            if [[ "$(git rev-list --count "$base"..HEAD)" -eq 0 ]]; then
              echo "No descendant commits to normalize on main."
              exit 0
            fi
          else
            git fetch origin main:refs/remotes/origin/main
            base="$(git merge-base HEAD refs/remotes/origin/main)"
          fi

          export NORMALIZE_BASE="$base"
          export NORMALIZE_TARGET_DATE="$target_date"

          normalize_cmd='idx=$(git rev-list --count "$NORMALIZE_BASE"..HEAD); normalized=$(date -d "$NORMALIZE_TARGET_DATE +${idx} minutes" --iso-8601=seconds); GIT_COMMITTER_NAME="Zohaib" GIT_COMMITTER_EMAIL="zohaibsaeed93@gmail.com" GIT_COMMITTER_DATE="$normalized" git commit --amend --no-edit --author="Zohaib <zohaibsaeed93@gmail.com>" --date="$normalized"'

          git rebase --rebase-merges --exec "$normalize_cmd" "$base"
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
