name: Normalize autonomous commit metadata

on:
  push:
    branches:
      - main
      - "auto/**"

permissions:
  contents: write

concurrency:
  group: history-normalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize autonomous commit metadata
        shell: bash
        run: |
          set -euo pipefail

          target_file=".github/autonomous-commit-date"
          if [[ -f "$target_file" ]]; then
            target_date="$(tr -d '\r\n' < "$target_file")"
          else
            target_date="2026-01-03T11:00:00+05:00"
          fi

          case "$target_date" in
            2026-01-*|2026-02-*) ;;
            *) echo "Refusing timestamp outside Jan/Feb 2026: $target_date" >&2; exit 1 ;;
          esac

          git config user.name "Zohaib"
          git config user.email "zohaibsaeed93@gmail.com"

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            range="HEAD"
          else
            git fetch origin main:refs/remotes/origin/main
            base="$(git merge-base HEAD refs/remotes/origin/main)"
            range="$base..HEAD"
          fi

          mapfile -t commits < <(git rev-list --reverse "$range")
          if (( ${#commits[@]} == 0 )); then
            echo "No commits to normalize."
            exit 0
          fi

          map_file="$(mktemp)"
          for i in "${!commits[@]}"; do
            printf '%s %s\n' "${commits[$i]}" "$i" >> "$map_file"
          done
          export NORMALIZE_MAP_FILE="$map_file"
          export NORMALIZE_TARGET_DATE="$target_date"

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            filter_range="HEAD"
          else
            filter_range="$range"
          fi

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
            idx="$(awk -v sha="$GIT_COMMIT" "$1 == sha {print $2}" "$NORMALIZE_MAP_FILE")"
            if [[ -n "$idx" ]]; then
              normalized="$(date -d "$NORMALIZE_TARGET_DATE +${idx} minutes" --iso-8601=seconds)"
              export GIT_AUTHOR_NAME="Zohaib"
              export GIT_AUTHOR_EMAIL="zohaibsaeed93@gmail.com"
              export GIT_COMMITTER_NAME="Zohaib"
              export GIT_COMMITTER_EMAIL="zohaibsaeed93@gmail.com"
              export GIT_AUTHOR_DATE="$normalized"
              export GIT_COMMITTER_DATE="$normalized"
            fi
          ' -- "$filter_range"

          rm -rf .git/refs/original/
          git reflog expire --expire=now --all
          git gc --prune=now

          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
