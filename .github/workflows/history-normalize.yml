name: Normalize autonomous commit metadata

on:
  push:
    branches:
      - main
      - "auto/**"

permissions:
  contents: write

concurrency:
  group: history-normalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize HEAD author and timestamps
        shell: bash
        run: |
          set -euo pipefail
          target_file=".github/autonomous-commit-date"
          if [[ -f "$target_file" ]]; then
            target_date="$(tr -d '\r\n' < "$target_file")"
          else
            target_date="2026-01-03T11:00:00+05:00"
          fi

          case "$target_date" in
            2026-01-*|2026-02-*) ;;
            *) echo "Refusing timestamp outside Jan/Feb 2026: $target_date" >&2; exit 1 ;;
          esac

          git config user.name "Zohaib"
          git config user.email "zohaibsaeed93@gmail.com"

          GIT_AUTHOR_DATE="$target_date" \
          GIT_COMMITTER_DATE="$target_date" \
            git commit --amend --no-edit \
              --author="Zohaib <zohaibsaeed93@gmail.com>" \
              --date="$target_date"

          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
