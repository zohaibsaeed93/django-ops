<style>
:root {
  --ink: #182e35;
  --muted: #70818a;
  --line: #e1e8e9;
  --canvas: #f4f7f7;
  --teal: #167d70;
  --teal-soft: #e8f5ef;
  --orange: #e17a45;
  --dark: #10242b;
  --red: #c04745;
  --amber: #a7751e;
  --radius: 14px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font:
    14px/1.55 "Segoe UI",
    system-ui,
    -apple-system,
    sans-serif;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select {
  -webkit-tap-highlight-color: transparent;
}
button,
a {
  touch-action: manipulation;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: wait;
  opacity: 0.55;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #67c5b3;
  outline-offset: 4px;
}
[hidden] {
  display: none !important;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 34px;
  line-height: 1.2;
  letter-spacing: -1.3px;
  font-weight: 650;
}
h2 {
  font-size: 19px;
  letter-spacing: -0.45px;
  font-weight: 650;
}
h3 {
  font-size: 15px;
  font-weight: 650;
}
p {
  color: var(--muted);
}
code,
pre,
.mono {
  font-family: Consolas, "SFMono-Regular", monospace;
  font-size: 12px;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-width: 100%;
  background: #eff4f4;
  border-radius: 8px;
  padding: 16px;
  color: #3d5861;
}
code {
  overflow-wrap: anywhere;
}
.icon-definitions {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}
.icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  vertical-align: middle;
}
.app-shell {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 234px;
  position: fixed;
  inset: 0 auto 0 0;
  background: var(--dark);
  color: #d0dedf;
  padding: 29px 20px 0;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  color: white;
  font-size: 23px;
  font-weight: 650;
  letter-spacing: -0.7px;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 31px;
  height: 34px;
  margin-right: 10px;
  color: #a6ddbf;
}
.brand-mark .icon {
  width: 28px;
  height: 28px;
  stroke-width: 2;
}
.brand-light {
  font-weight: 350;
  color: #a6ddbf;
}
.brand-version {
  font:
    10px/1.3 Consolas,
    monospace;
  margin-left: 9px;
  border: 1px solid #36545b;
  padding: 2px 5px;
  border-radius: 4px;
  color: #9cb6bb;
}
.workspace-label {
  font-size: 9px;
  letter-spacing: 1.7px;
  color: #7a979e;
  font-weight: 700;
  margin: 36px 12px 11px;
}
.workspace-card {
  display: flex;
  gap: 11px;
  align-items: center;
  padding: 12px 10px;
  border: 1px solid #2a4249;
  border-radius: 10px;
  background: #182e35;
}
.workspace-icon {
  background: #2d454b;
  border-radius: 8px;
  padding: 9px;
  color: #cce6da;
}
.workspace-card strong {
  font-size: 12px;
  font-weight: 600;
  color: #edf4f3;
}
.workspace-card span:not(.workspace-icon) {
  display: block;
  font-size: 10px;
  color: #89a3aa;
  margin-top: 3px;
}
.nav-label {
  margin-top: 30px;
}
.nav-item {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  padding: 12px 14px;
  margin: 4px 0;
  border-radius: 8px;
  color: #94acb2;
  transition:
    background 0.15s,
    color 0.15s;
}
.nav-item .icon {
  width: 18px;
  height: 18px;
}
.nav-item:hover {
  background: #19353c;
  color: white;
}
.nav-item.active {
  background: #25443f;
  color: #c1ecd3;
  box-shadow: inset 3px 0 #97ccac;
}
.sidebar-bottom {
  margin-top: auto;
}
.sidebar-note {
  padding: 25px 13px 23px;
  border-top: 1px solid #29414a;
  margin-top: 34px;
}
.tiny-kicker {
  font-size: 9px;
  font-weight: 650;
  letter-spacing: 1.7px;
  color: #7ba08b;
}
.sidebar-note p {
  color: #d6e3df;
  font-size: 17px;
  line-height: 1.45;
  margin-top: 9px;
}
.text-link {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  background: none;
  border: 0;
  padding: 0;
  color: var(--teal);
  font-weight: 600;
  font-size: 12px;
}
.text-link .icon {
  width: 15px;
  height: 15px;
}
.text-link.light {
  color: #92b8a7;
  margin-top: 15px;
  font-size: 10px;
}
.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 0;
  border-top: 1px solid #29414a;
}
.avatar {
  display: grid;
  place-items: center;
  border-radius: 50%;
  width: 31px;
  height: 31px;
  background: #bacebe;
  color: #203c36;
  font-size: 12px;
  font-weight: 650;
  flex-shrink: 0;
}
.user-card strong {
  display: block;
  font-size: 11px;
  max-width: 112px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-card div span {
  font-size: 10px;
  color: #7f9ca4;
}
.user-card form {
  margin-left: auto;
}
.icon-button {
  display: grid;
  place-items: center;
  min-width: 32px;
  min-height: 32px;
  background: none;
  border: 0;
  border-radius: 8px;
  color: inherit;
}
.icon-button:hover {
  background: #ffffff15;
}
.main-shell {
  width: calc(100% - 234px);
  margin-left: 234px;
}
.topbar {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 38px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  gap: 12px;
}
.breadcrumb {
  font-size: 12px;
  color: #87979b;
  display: flex;
  align-items: center;
  gap: 14px;
}
.breadcrumb span {
  color: #c4cecf;
}
.breadcrumb strong {
  font-weight: 500;
  color: #3a525a;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}
.mode-switch {
  display: flex;
  background: #eef3f2;
  padding: 3px;
  border: 1px solid #e6edeb;
  border-radius: 7px;
  font-size: 11px;
}
.mode-switch a {
  padding: 6px 11px;
  border-radius: 5px;
  color: #83908d;
}
.mode-switch .selected {
  background: white;
  color: #345a50;
  box-shadow: 0 1px 4px #193b2a14;
  font-weight: 600;
}
.help-button {
  color: #7b8f94;
  border: 1px solid var(--line);
  min-width: 31px;
  min-height: 31px;
}
.help-button:hover {
  background: var(--canvas);
}
.main-content {
  max-width: 1440px;
  margin: auto;
  padding: 32px 38px 0;
}
.demo-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 10px 15px;
  background: #fff4e9;
  border: 1px solid #f1e1cd;
  border-radius: 9px;
  font-size: 11px;
  color: #9b683c;
  margin-bottom: 29px;
}
.demo-banner strong {
  font-weight: 650;
  margin-right: 7px;
  color: #8e5e35;
}
.demo-banner .text-link {
  color: #9b683c;
  font-size: 11px;
  white-space: nowrap;
}
.demo-banner .icon {
  width: 15px;
  height: 15px;
  margin-right: 7px;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 26px;
  gap: 20px;
}
.page-heading p {
  margin-top: 9px;
  font-size: 12px;
}
.eyebrow {
  display: block;
  font-size: 9px;
  letter-spacing: 1.8px;
  font-weight: 700;
  color: var(--teal);
  margin-bottom: 9px;
}
.heading-actions {
  display: flex;
  gap: 9px;
  align-items: center;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 7px;
  border: 1px solid var(--line);
  font-weight: 600;
  font-size: 11px;
  white-space: nowrap;
  min-height: 38px;
  background: white;
  color: #425c63;
  transition:
    background 0.15s,
    transform 0.15s;
}
.button:hover {
  background: #eef5f2;
}
.button.primary {
  background: var(--teal);
  color: white;
  border-color: var(--teal);
  box-shadow: 0 2px 3px #194d3912;
}
.button.primary:hover {
  background: #12665c;
}
.button .icon {
  width: 15px;
  height: 15px;
}
.button.small {
  padding: 7px 11px;
  min-height: 31px;
  font-size: 10px;
}
.button.danger {
  color: var(--red);
  border-color: #edd9d7;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 5px;
  line-height: 1.3;
  font-size: 9px;
  font-weight: 600;
  white-space: nowrap;
  background: #eff3f3;
  color: #71848a;
}
.badge.good,
.badge.succeeded,
.badge.pass,
.badge.rolled_back,
.badge.connected {
  background: #e5f4eb;
  color: #3a8060;
}
.badge.warning,
.badge.pending,
.badge.running,
.badge.overloaded,
.badge.rollback_blocked {
  background: #fff2dd;
  color: #a67627;
}
.badge.failed,
.badge.fail,
.badge.offline,
.badge.disconnected,
.badge.timeout {
  background: #f9ece9;
  color: #b76357;
}
.badge.cancelled,
.badge.neutral {
  background: #edf1f4;
  color: #7b8a98;
}
.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  display: inline-block;
}
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.metric-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 17px 18px;
  min-width: 0;
}
.metric-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 11px;
  color: #859aa0;
}
.metric-top span {
  color: #7e9095;
  font-size: 10px;
  font-weight: 500;
}
.metric-top .icon {
  width: 17px;
  height: 17px;
}
.metric-value {
  font-size: 27px;
  line-height: 1.3;
  letter-spacing: -1px;
  font-weight: 600;
}
.metric-value small {
  font-size: 13px;
  color: #9daeb2;
  font-weight: 400;
  letter-spacing: 0;
  margin-left: 3px;
}
.metric-note {
  margin-top: 8px;
  font-size: 10px;
  color: #8e9da1;
}
.metric-note .dot {
  display: inline-block;
  height: 5px;
  width: 5px;
  background: #70a18b;
  border-radius: 50%;
  margin-right: 5px;
}
.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 22px;
}
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  min-width: 0;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 21px 23px;
  border-bottom: 1px solid #edf1f1;
  gap: 12px;
}
.card-header h2 {
  font-size: 14px;
  letter-spacing: -0.2px;
}
.card-header p {
  font-size: 10px;
  margin-top: 3px;
}
.card-body {
  padding: 22px 23px;
}
.section-space {
  margin-top: 22px;
}
.release-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 24px;
}
.release-summary strong {
  font-size: 14px;
  font-weight: 600;
}
.release-summary p {
  font-size: 10px;
  margin-top: 3px;
}
.release-icon {
  background: #f3f6f6;
  width: 40px;
  height: 40px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: #6b8982;
  flex-shrink: 0;
}
.release-identity {
  display: flex;
  gap: 12px;
  align-items: center;
}
.pipeline {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  position: relative;
  margin: 10px 0 24px;
}
.pipeline:before {
  content: "";
  position: absolute;
  height: 1px;
  background: #dde7e1;
  top: 15px;
  left: 12%;
  right: 12%;
}
.pipeline-stage {
  z-index: 1;
  text-align: center;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 8px;
  font-size: 10px;
  color: #7d9290;
}
.pipeline-node {
  width: 31px;
  height: 31px;
  border-radius: 50%;
  background: #f0f4f3;
  border: 4px solid #fff;
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 1px #e6ece9;
  font-size: 10px;
  color: #94a6a0;
}
.pipeline-stage.done .pipeline-node {
  background: #e4f4e9;
  color: #38795b;
  box-shadow: 0 0 0 1px #e4f4e9;
}
.pipeline-stage.running .pipeline-node {
  background: #fff0dc;
  color: #a67627;
  box-shadow: 0 0 0 1px #eec999;
  animation: pulse 1s ease-in-out infinite;
}
.pipeline-stage.failed .pipeline-node {
  background: #fae8e4;
  color: #bb5c52;
}
.pipeline-stage strong {
  font-size: 10px;
  font-weight: 600;
}
.pipeline-stage span:last-child {
  font-size: 9px;
}
.pipeline-note {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  color: #728a80;
  font-size: 10px;
  background: #f4f8f5;
  border: 1px solid #eaf1eb;
  padding: 10px 12px;
  border-radius: 6px;
}
.pipeline-note .icon {
  height: 14px;
  width: 14px;
  margin-top: 1px;
}
.pipeline-note.warning {
  background: #fff7e8;
  color: #9b732d;
  border-color: #f1e3c8;
}
.pipeline-note.failed {
  background: #fff2ee;
  color: #af6358;
  border-color: #f1d8cf;
}
.service-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #edf1f1;
  padding: 12px 0;
  gap: 10px;
}
.service-row:last-child {
  border: 0;
  padding-bottom: 0;
}
.service-row:first-child {
  padding-top: 0;
}
.service-name {
  display: flex;
  gap: 11px;
  align-items: center;
}
.service-name .icon {
  width: 16px;
  height: 16px;
  color: #8ea6a8;
}
.service-name strong {
  font-size: 11px;
  font-weight: 550;
}
.service-name span {
  display: block;
  font-size: 9px;
  color: #9baaae;
}
.stack-strip {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 9px;
  color: #899da2;
  margin-top: 18px;
  flex-wrap: wrap;
}
.stack-strip span {
  background: #f4f7f7;
  border: 1px solid #edf1f1;
  border-radius: 4px;
  padding: 3px 6px;
}
.walkthrough {
  background: #eaf1ed;
  border: 1px solid #dce8df;
  border-radius: var(--radius);
  padding: 21px 23px;
  position: relative;
  overflow: hidden;
}
.walkthrough h2 {
  font-size: 18px;
  max-width: 330px;
}
.walkthrough p {
  font-size: 11px;
  color: #7b9182;
  max-width: 370px;
  margin-top: 8px;
}
.walkthrough .eyebrow {
  color: #699477;
}
.walkthrough-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-top: 21px;
}
.walkthrough-step {
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  background: none;
  border: 0;
  padding: 0;
  color: #365d48;
  width: 100%;
  font-size: 11px;
}
.step-number {
  font:
    10px Consolas,
    monospace;
  color: #6f947a;
  width: 24px;
  height: 24px;
  border: 1px solid #cadcd0;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.walkthrough-step > .icon {
  width: 14px;
  height: 14px;
  margin-left: auto;
  color: #91a99b;
}
.walkthrough-step:hover {
  color: #0d7552;
}
.dark-card {
  background: #153239;
  border-color: #153239;
  color: #d8e5e4;
}
.dark-card .eyebrow {
  color: #8cbfac;
}
.dark-card h2 {
  color: #eff5f1;
  font-size: 17px;
}
.dark-card p {
  font-size: 10px;
  color: #92afb0;
  margin-top: 9px;
}
.connection-flow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 22px;
}
.connection-flow > div {
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 8px;
  text-align: center;
  font-size: 9px;
  color: #a9c2bc;
}
.connection-flow .icon {
  height: 23px;
  width: 23px;
  color: #b1d7c1;
}
.flow-arrow {
  color: #a9c1b0;
  font-size: 15px;
}
.dark-card .text-link {
  font-size: 10px;
  margin-top: 20px;
  color: #a8d3b8;
}
.history-list {
  display: flex;
  flex-direction: column;
}
.history-row {
  display: flex;
  gap: 11px;
  padding: 14px 0;
  align-items: center;
  border-bottom: 1px solid #edf1f1;
}
.history-row:first-child {
  padding-top: 0;
}
.history-row:last-child {
  border: 0;
  padding-bottom: 0;
}
.history-symbol {
  background: #eaf4ec;
  color: #5a9671;
  width: 29px;
  height: 29px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.history-symbol .icon {
  width: 13px;
  height: 13px;
}
.history-copy {
  flex: 1;
  min-width: 0;
}
.history-copy strong {
  display: block;
  font-size: 11px;
  font-weight: 550;
}
.history-copy span {
  display: block;
  font-size: 9px;
  color: #94a3a7;
  margin-top: 2px;
}
.history-row time {
  font-size: 9px;
  color: #97a8ad;
  white-space: nowrap;
}
.card-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 23px;
  border-top: 1px solid #edf1f1;
  background: #fcfdfd;
  gap: 12px;
}
.card-actions span {
  color: #9aa9ad;
  font-size: 9px;
}
.page-footer {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 27px 0 20px;
  color: #a0aeb0;
  font-size: 9px;
}
.footer-dot {
  margin: 0 6px;
  color: #c1ccce;
}
.demo-panel {
  scroll-margin-top: 25px;
}
.section-intro {
  max-width: 630px;
  font-size: 12px;
  color: #7c9294;
  margin-bottom: 24px;
}
.control-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  padding: 20px 23px;
  border-bottom: 1px solid #edf1f1;
  flex-wrap: wrap;
}
.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  max-width: 420px;
}
.form-field label {
