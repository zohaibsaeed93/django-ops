<style>
:root {
  color-scheme: light;
  --ink: #25263b;
  --muted: #6d6e84;
  --line: #e2e2ec;
  --canvas: #f5f4f8;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --surface-subtle: #f8f7fb;
  --accent: #6653cf;
  --accent-hover: #5440bb;
  --accent-soft: #f0edff;
  --primary-ink: #ffffff;
  --success: #256a4d;
  --success-soft: #eaf7f0;
  --red: #af3d52;
  --red-soft: #ffedf0;
  --amber: #8b611e;
  --amber-soft: #fff5e1;
  --dark: #171823;
  --radius: 16px;
  --shadow: 0 3px 12px #25203805, 0 1px 2px #25203804;
  --grid: #77729c09;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #eeedf7;
  --muted: #a4a6bc;
  --line: #303242;
  --canvas: #101117;
  --surface: #191b25;
  --surface-raised: #20222f;
  --surface-subtle: #1d1f2b;
  --accent: #b5a6ff;
  --accent-hover: #c5baff;
  --accent-soft: #2c2648;
  --primary-ink: #191528;
  --success: #91d9b3;
  --success-soft: #183b30;
  --red: #ffa0b2;
  --red-soft: #3e2330;
  --amber: #efc47d;
  --amber-soft: #3b3022;
  --dark: #13141e;
  --shadow: 0 4px 18px #00000012;
  --grid: #c0b5ff06;
}

* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font:
    14px/1.55 "Segoe UI",
    system-ui,
    -apple-system,
    sans-serif;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select {
  -webkit-tap-highlight-color: transparent;
}
button,
a {
  touch-action: manipulation;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: wait;
  opacity: 0.55;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 4px;
}
[hidden] {
  display: none !important;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 34px;
  line-height: 1.2;
  letter-spacing: -1.3px;
  font-weight: 600;
}
h2 {
  font-size: 19px;
  letter-spacing: -0.45px;
  font-weight: 600;
}
h3 {
  font-size: 15px;
  font-weight: 600;
}
p {
  color: var(--muted);
}
code,
pre,
.mono {
  font-family: Consolas, "SFMono-Regular", monospace;
  font-size: 12px;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-width: 100%;
  background: var(--surface-subtle);
  border-radius: 8px;
  padding: 16px;
  color: var(--ink);
}
code {
  overflow-wrap: anywhere;
}
.icon-definitions {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}
.icon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  vertical-align: middle;
}
.app-shell {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 234px;
  position: fixed;
  inset: 0 auto 0 0;
  background: var(--dark);
  color: #d0dedf;
  padding: 29px 20px 0;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  color: var(--primary-ink);
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -0.7px;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 31px;
  height: 34px;
  margin-right: 10px;
  color: #a6ddbf;
}
.brand-mark .icon {
  width: 28px;
  height: 28px;
  stroke-width: 2;
}
.brand-light {
  font-weight: 350;
  color: #a6ddbf;
}
.brand-version {
  font:
    10px/1.3 Consolas,
    monospace;
  margin-left: 9px;
  border: 1px solid #36545b;
  padding: 2px 5px;
  border-radius: 4px;
  color: #9cb6bb;
}
.workspace-label {
  font-size: 9px;
  letter-spacing: 1.7px;
  color: #7a979e;
  font-weight: 700;
  margin: 36px 12px 11px;
}
.workspace-card {
  display: flex;
  gap: 11px;
  align-items: center;
  padding: 12px 10px;
  border: 1px solid #2a4249;
  border-radius: 10px;
  background: #182e35;
}
.workspace-icon {
  background: #2d454b;
  border-radius: 8px;
  padding: 9px;
  color: #cce6da;
}
.workspace-card strong {
  font-size: 12px;
  font-weight: 600;
  color: #edf4f3;
}
.workspace-card span:not(.workspace-icon) {
  display: block;
  font-size: 10px;
  color: #89a3aa;
  margin-top: 3px;
}
.nav-label {
  margin-top: 30px;
}
.nav-item {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  padding: 12px 14px;
  margin: 4px 0;
  border-radius: 8px;
  color: #94acb2;
  transition:
    background 0.15s,
    color 0.15s;
}
.nav-item .icon {
  width: 18px;
  height: 18px;
}
.nav-item:hover {
  background: #19353c;
  color: var(--primary-ink);
}
.nav-item.active {
  background: #25443f;
  color: #c1ecd3;
  box-shadow: inset 3px 0 #97ccac;
}
.sidebar-bottom {
  margin-top: auto;
}
.sidebar-note {
  padding: 25px 13px 23px;
  border-top: 1px solid #29414a;
  margin-top: 34px;
}
.tiny-kicker {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.7px;
  color: #7ba08b;
}
.sidebar-note p {
  color: #d6e3df;
  font-size: 17px;
  line-height: 1.45;
  margin-top: 9px;
}
.text-link {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent);
  font-weight: 600;
  font-size: 12px;
}
.text-link .icon {
  width: 15px;
  height: 15px;
}
.text-link.light {
  color: #92b8a7;
  margin-top: 15px;
  font-size: 10px;
}
.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 0;
  border-top: 1px solid #29414a;
}
.avatar {
  display: grid;
  place-items: center;
  border-radius: 50%;
  width: 31px;
  height: 31px;
  background: #bacebe;
  color: #203c36;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}
.user-card strong {
  display: block;
  font-size: 11px;
  max-width: 112px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-card div span {
  font-size: 10px;
  color: #7f9ca4;
}
.user-card form {
  margin-left: auto;
}
.icon-button {
  display: grid;
  place-items: center;
  min-width: 32px;
  min-height: 32px;
  background: none;
  border: 0;
  border-radius: 8px;
  color: inherit;
}
.icon-button:hover {
  background: #ffffff15;
}
.main-shell {
  width: calc(100% - 234px);
  margin-left: 234px;
}
.topbar {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 38px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  gap: 12px;
}
.breadcrumb {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 14px;
}
.breadcrumb span {
  color: var(--line);
}
.breadcrumb strong {
  font-weight: 500;
  color: var(--ink);
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}
.mode-switch {
  display: flex;
  background: var(--surface-subtle);
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 11px;
}
.mode-switch a {
  padding: 6px 11px;
  border-radius: 5px;
  color: var(--muted);
}
.mode-switch .selected {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 4px #193b2a14;
  font-weight: 600;
}
.help-button {
  color: var(--muted);
  border: 1px solid var(--line);
  min-width: 31px;
  min-height: 31px;
}
.help-button:hover {
  background: var(--canvas);
}
.main-content {
  max-width: 1440px;
  margin: auto;
  padding: 32px 38px 0;
}
.demo-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 10px 15px;
  background: var(--amber-soft);
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 11px;
  color: var(--amber);
  margin-bottom: 29px;
}
.demo-banner strong {
  font-weight: 600;
  margin-right: 7px;
  color: var(--amber);
}
.demo-banner .text-link {
  color: var(--amber);
  font-size: 11px;
  white-space: nowrap;
}
.demo-banner .icon {
  width: 15px;
  height: 15px;
  margin-right: 7px;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 26px;
  gap: 20px;
}
.page-heading p {
  margin-top: 9px;
  font-size: 12px;
}
.eyebrow {
  display: block;
  font-size: 9px;
  letter-spacing: 1.8px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 9px;
}
.heading-actions {
  display: flex;
  gap: 9px;
  align-items: center;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 7px;
  border: 1px solid var(--line);
  font-weight: 600;
  font-size: 11px;
  white-space: nowrap;
  min-height: 38px;
  background: var(--surface);
  color: var(--ink);
  transition:
    background 0.15s,
    transform 0.15s;
}
.button:hover {
  background: var(--surface-subtle);
}
.button.primary {
  background: var(--accent);
  color: var(--primary-ink);
  border-color: var(--accent);
  box-shadow: 0 2px 3px #194d3912;
}
.button.primary:hover {
  background: var(--accent-hover);
}
.button .icon {
  width: 15px;
  height: 15px;
}
.button.small {
  padding: 7px 11px;
  min-height: 31px;
  font-size: 10px;
}
.button.danger {
  color: var(--red);
  border-color: var(--line);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 5px;
  line-height: 1.3;
  font-size: 9px;
  font-weight: 600;
  white-space: nowrap;
  background: var(--surface-subtle);
  color: var(--muted);
}
.badge.good,
.badge.succeeded,
.badge.pass,
.badge.rolled_back,
.badge.connected {
  background: var(--success-soft);
  color: var(--success);
}
.badge.warning,
.badge.pending,
.badge.running,
.badge.overloaded,
.badge.rollback_blocked {
  background: var(--amber-soft);
  color: var(--amber);
}
.badge.failed,
.badge.fail,
.badge.offline,
.badge.disconnected,
.badge.timeout {
  background: var(--red-soft);
  color: var(--red);
}
.badge.cancelled,
.badge.neutral {
  background: var(--surface-subtle);
  color: var(--muted);
}
.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  display: inline-block;
}
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.metric-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 17px 18px;
  min-width: 0;
}
.metric-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 11px;
  color: var(--muted);
}
.metric-top span {
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
}
.metric-top .icon {
  width: 17px;
  height: 17px;
}
.metric-value {
  font-size: 27px;
  line-height: 1.3;
  letter-spacing: -1px;
  font-weight: 600;
}
.metric-value small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0;
  margin-left: 3px;
}
.metric-note {
  margin-top: 8px;
  font-size: 10px;
  color: var(--muted);
}
.metric-note .dot {
  display: inline-block;
  height: 5px;
  width: 5px;
  background: var(--success);
  border-radius: 50%;
  margin-right: 5px;
}
.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 22px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  min-width: 0;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 21px 23px;
  border-bottom: 1px solid var(--line);
  gap: 12px;
}
.card-header h2 {
  font-size: 14px;
  letter-spacing: -0.2px;
}
.card-header p {
  font-size: 10px;
  margin-top: 3px;
}
.card-body {
  padding: 22px 23px;
}
.section-space {
  margin-top: 22px;
}
.release-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 24px;
}
.release-summary strong {
  font-size: 14px;
  font-weight: 600;
}
.release-summary p {
  font-size: 10px;
  margin-top: 3px;
}
.release-icon {
  background: var(--surface-subtle);
  width: 40px;
  height: 40px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: var(--muted);
  flex-shrink: 0;
}
.release-identity {
  display: flex;
  gap: 12px;
  align-items: center;
}
.pipeline {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  position: relative;
  margin: 10px 0 24px;
}
.pipeline:before {
  content: "";
  position: absolute;
  height: 1px;
  background: var(--line);
  top: 15px;
  left: 12%;
  right: 12%;
}
.pipeline-stage {
  z-index: 1;
  text-align: center;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
}
.pipeline-node {
  width: 31px;
  height: 31px;
  border-radius: 50%;
  background: var(--surface-subtle);
  border: 4px solid var(--surface);
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 1px var(--line);
  font-size: 10px;
  color: var(--muted);
}
.pipeline-stage.done .pipeline-node {
  background: var(--success-soft);
  color: var(--success);
  box-shadow: 0 0 0 1px var(--success-soft);
}
.pipeline-stage.running .pipeline-node {
  background: var(--amber-soft);
  color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber-soft);
  animation: pulse 1s ease-in-out infinite;
}
.pipeline-stage.failed .pipeline-node {
  background: var(--red-soft);
  color: var(--red);
}
.pipeline-stage strong {
  font-size: 10px;
  font-weight: 600;
}
.pipeline-stage span:last-child {
  font-size: 9px;
}
.pipeline-note {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  color: var(--muted);
  font-size: 10px;
  background: var(--success-soft);
  border: 1px solid var(--line);
  padding: 10px 12px;
  border-radius: 6px;
}
.pipeline-note .icon {
  height: 14px;
  width: 14px;
  margin-top: 1px;
}
.pipeline-note.warning {
  background: var(--amber-soft);
  color: var(--amber);
  border-color: var(--line);
}
.pipeline-note.failed {
  background: var(--red-soft);
  color: var(--red);
  border-color: var(--line);
}
.service-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 12px 0;
  gap: 10px;
}
.service-row:last-child {
  border: 0;
  padding-bottom: 0;
}
.service-row:first-child {
  padding-top: 0;
}
.service-name {
  display: flex;
  gap: 11px;
  align-items: center;
}
.service-name .icon {
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.service-name strong {
  font-size: 11px;
  font-weight: 550;
}
.service-name span {
  display: block;
  font-size: 9px;
  color: var(--muted);
}
.stack-strip {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 9px;
  color: var(--muted);
  margin-top: 18px;
  flex-wrap: wrap;
}
.stack-strip span {
  background: var(--surface-subtle);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 3px 6px;
}
.walkthrough {
  background: var(--accent-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 21px 23px;
  position: relative;
  overflow: hidden;
}
.walkthrough h2 {
  font-size: 18px;
  max-width: 330px;
}
.walkthrough p {
  font-size: 11px;
  color: var(--muted);
  max-width: 370px;
  margin-top: 8px;
}
.walkthrough .eyebrow {
  color: var(--accent);
}
.walkthrough-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
  margin-top: 21px;
}
.walkthrough-step {
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  background: none;
  border: 0;
  padding: 0;
  color: var(--ink);
  width: 100%;
  font-size: 11px;
}
.step-number {
  font:
    10px Consolas,
    monospace;
  color: var(--accent);
  width: 24px;
  height: 24px;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.walkthrough-step > .icon {
  width: 14px;
  height: 14px;
  margin-left: auto;
  color: var(--muted);
}
.walkthrough-step:hover {
  color: var(--accent);
}
.dark-card {
  background: #153239;
  border-color: #153239;
  color: #d8e5e4;
}
.dark-card .eyebrow {
  color: #8cbfac;
}
.dark-card h2 {
  color: var(--accent-soft);
  font-size: 17px;
}
.dark-card p {
  font-size: 10px;
  color: #92afb0;
  margin-top: 9px;
}
.connection-flow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 22px;
}
.connection-flow > div {
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 8px;
  text-align: center;
  font-size: 9px;
  color: #a9c2bc;
}
.connection-flow .icon {
  height: 23px;
  width: 23px;
  color: #b1d7c1;
}
.flow-arrow {
  color: #a9c1b0;
  font-size: 15px;
}
.dark-card .text-link {
  font-size: 10px;
  margin-top: 20px;
  color: #a8d3b8;
}
.history-list {
  display: flex;
  flex-direction: column;
}
.history-row {
  display: flex;
  gap: 11px;
  padding: 14px 0;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.history-row:first-child {
  padding-top: 0;
}
.history-row:last-child {
  border: 0;
  padding-bottom: 0;
}
.history-symbol {
  background: var(--success-soft);
  color: var(--success);
  width: 29px;
  height: 29px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.history-symbol .icon {
  width: 13px;
  height: 13px;
}
.history-copy {
  flex: 1;
  min-width: 0;
}
.history-copy strong {
  display: block;
  font-size: 11px;
  font-weight: 550;
}
.history-copy span {
  display: block;
  font-size: 9px;
  color: var(--muted);
  margin-top: 2px;
}
.history-row time {
  font-size: 9px;
  color: var(--muted);
  white-space: nowrap;
}

/* Shared design system: the same semantic surfaces work in both themes. */
body {
  background-image: radial-gradient(
    ellipse at 85% 0%,
    var(--accent-soft),
    transparent 45%
  );
  -webkit-font-smoothing: antialiased;
}
::selection {
  background: var(--accent-soft);
  color: var(--ink);
}
h1,
h2,
h3 {
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
.skip-link {
  position: fixed;
  left: 16px;
  top: -80px;
  z-index: 100;
  background: var(--accent);
  color: var(--primary-ink);
  padding: 12px 20px;
  border-radius: 10px;
}
.skip-link:focus {
  top: 12px;
}
.sidebar {
  background:
    radial-gradient(ellipse at 0% 0%, #34305270, transparent 55%), var(--dark);
  border-right: 1px solid #ffffff0a;
