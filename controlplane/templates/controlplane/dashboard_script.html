<script>
(() => {
  "use strict";
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) =>
    Array.from(root.querySelectorAll(selector));
  const guide = $("#guide-dialog");
  $$("[data-open-guide]").forEach((button) =>
    button.addEventListener("click", () => guide.showModal()),
  );
  $$("[data-close-guide]").forEach((button) =>
    button.addEventListener("click", () => guide.close()),
  );
  guide.addEventListener("click", (event) => {
    if (event.target === guide) guide.close();
  });
  const labels = {
    pending: "Pending",
    running: "Running",
    succeeded: "Succeeded",
    failed: "Failed",
    cancelled: "Cancelled",
    offline: "Offline",
    overloaded: "Overloaded",
    disconnected: "Disconnected",
    timeout: "Timeout",
  };
  const terminal = new Set([
    "succeeded",
    "failed",
    "cancelled",
    "offline",
    "overloaded",
    "disconnected",
    "timeout",
  ]);
  const setBadge = (element, text, tone = "neutral") => {
    if (!element) return;
    element.textContent = text;
    element.className = "badge " + tone;
  };
  const make = (tag, text, className) => {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
  };
  // Results are rendered as text, including details returned by a real agent.
  $$("[data-operation]").forEach((element) => {
    const status = $("[data-status]", element);
    if (terminal.has(status.dataset.status)) return;
    let attempts = 0;
    const tick = async () => {
      if (attempts++ >= 120) return;
      try {
        const response = await fetch(
          "/operations/" + element.dataset.operation + "/updates",
          { credentials: "same-origin" },
        );
        if (!response.ok) return;
        const data = await response.json();
        if (!Object.hasOwn(labels, data.status)) return;
        setBadge(status, labels[data.status], data.status);
        status.dataset.status = data.status;
        const results = $(".operation-results", element);
        const checks = Array.isArray(data.result?.checks)
          ? data.result.checks.slice(0, 32)
          : [];
        results.replaceChildren();
        checks.forEach((check) => {
          const row = make("div", undefined, "check-row");
          const copy = make("div", undefined, "check-copy");
          copy.append(
            make("strong", check.name || "Diagnostic detail"),
            make("p", check.detail || "No detail returned."),
          );
          row.append(copy);
          const badge = make(
            "span",
            String(check.status || "unknown"),
            "badge",
          );
          badge.classList.add(check.status === "pass" ? "good" : "neutral");
          row.append(badge);
          results.append(row);
        });
        if (!checks.length)
          results.append(
            make(
              "p",
              terminal.has(data.status)
                ? data.error_code
                  ? "Operation ended: " + data.error_code
                  : "No check details were returned."
                : "Waiting for the agent’s diagnostic result…",
            ),
          );
        $("pre", element).textContent = JSON.stringify(
          data.result || {},
          null,
          2,
        );
        if (terminal.has(data.status))
          $("[data-cancel-form]", element)?.remove();
        else setTimeout(tick, 2000);
      } catch {
        /* A temporary network failure is retried within the same bounded budget. */ setTimeout(
          tick,
          2000,
        );
      }
    };
    setTimeout(tick, 1000);
  });
  const shell = $(".app-shell");
  if (shell.dataset.demo !== "true") {
    $$(".nav-item").forEach((link) =>
      link.addEventListener("click", () => {
        $$(".nav-item").forEach((item) =>
          item.classList.toggle("active", item === link),
        );
        $("[data-view-title]").textContent = link.textContent.trim();
      }),
    );
    return;
  }
  const viewLabels = {
    overview: "Overview",
    diagnostics: "Diagnostics",
    deployments: "Deployments",
    recovery: "Recovery",
    setup: "Project setup",
  };
  const openView = (name, updateHistory = true) => {
    if (!Object.hasOwn(viewLabels, name)) name = "overview";
    $$("[data-panel]").forEach(
      (panel) => (panel.hidden = panel.dataset.panel !== name),
    );
    $$(".nav-item").forEach((link) => {
      const selected = link.dataset.view === name;
      link.classList.toggle("active", selected);
      if (selected) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    $("[data-view-title]").textContent = viewLabels[name];
    if (updateHistory) history.pushState(null, "", "#" + name);
    window.scrollTo({ top: 0, behavior: "instant" });
  };
  $$("[data-view]").forEach((button) =>
    button.addEventListener("click", (event) => {
      event.preventDefault();
      if (button.dataset.scenario)
        $("#deploy-scenario").value = button.dataset.scenario;
      openView(button.dataset.view);
    }),
  );
  window.addEventListener("popstate", () =>
    openView(location.hash.slice(1), false),
  );
  openView(location.hash.slice(1) || "overview", false);
  const baselineChecks = [
    [
      "Django deployment checks",
      "Application configuration passes the sample deployment checks.",
    ],
    [
      "Database connectivity",
      "PostgreSQL connection established. The application can read its database.",
    ],
    [
      "Migration state",
      "No pending migrations. The database schema matches this sample release.",
    ],
    [
      "Celery worker + Beat",
      "A worker responds and the scheduled task service is running.",
    ],
    [
      "Runtime versions",
      "Django 5.2 / Python 3.12 reported by the sample application.",
    ],
  ];
  let state,
    generation = 0,
    busy = false,
    deployment = null,
    toastTimer;
  const delay = (milliseconds) =>
    new Promise((resolve) => setTimeout(resolve, milliseconds));
  const toast = (message) => {
    const box = $("[data-toast]");
    box.textContent = message;
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (box.hidden = true), 3800);
  };
  const setText = (selector, text) =>
    $$(selector).forEach((element) => (element.textContent = text));
  const lock = (value) => {
    busy = value;
    $$("[data-action]")
      .filter((button) => !["reset", "cancel"].includes(button.dataset.action))
      .forEach((button) => (button.disabled = value));
    $$("select").forEach((select) => (select.disabled = value));
    $('[data-action="cancel"]').disabled = !value || !deployment;
  };
  const pipeline = (selector, stages) => {
    $$(".pipeline-stage", $(selector)).forEach((element, index) => {
      const stage = stages[index] || "";
      element.className = "pipeline-stage " + stage;
      $(".pipeline-node", element).textContent =
        stage === "done" ? "✓" : stage === "failed" ? "!" : String(index + 1);
    });
  };
  const message = (selector, text, tone = "") => {
    const element = $(selector);
    element.textContent = text;
    element.className = "result-message " + tone;
  };
  const note = (text, tone = "") => {
    const element = $("[data-deploy-note]");
    element.className = "pipeline-note " + tone;
    $("span", element).textContent = text;
  };
  const renderChecks = (scenario = "healthy") => {
    const checks = $("[data-checks]");
    checks.replaceChildren();
    baselineChecks.forEach(([name, detail], index) => {
      const failed =
        (scenario === "database" && index === 1) ||
        (scenario === "worker" && index === 3);
      const blocked = scenario === "database" && index === 2;
      const row = make(
        "div",
        undefined,
        "check-row" + (failed ? " failed" : ""),
      );
      row.append(
        make("span", failed ? "!" : blocked ? "–" : "✓", "check-symbol"),
      );
      const copy = make("div", undefined, "check-copy");
      if (failed)
        detail =
          scenario === "database"
            ? "Sample connection refused. Verify the database service and the provisioned connection settings."
            : "No sample worker response. Inspect the worker service and its broker connection.";
      if (blocked)
        detail =
          "Not checked: migration state cannot be evaluated without a database connection.";
      copy.append(make("strong", name), make("p", detail));
      row.append(
        copy,
        make(
          "span",
          failed ? "Failed" : blocked ? "Not checked" : "Passed",
          "badge " + (failed ? "failed" : blocked ? "neutral" : "good"),
        ),
      );
      checks.append(row);
    });
  };
  const renderState = () => {
    setText("[data-release]", state.release);
    const health = $("[data-health-count]");
    health.replaceChildren(
      document.createTextNode(
        (state.health === "healthy" ? 5 : state.health === "database" ? 3 : 4) +
          " ",
      ),
      make("small", "/ 5 checks"),
    );
    setText(
      "[data-health-note]",
      state.health === "healthy"
        ? "All checks passing · sample result"
        : state.health === "database"
          ? "1 failed · 1 not checked · simulated"
          : "1 check needs attention · simulated",
    );
    setBadge(
      $("[data-stack-db]"),
      state.health === "database" ? "Unavailable" : "Connected",
      state.health === "database" ? "failed" : "good",
    );
    setBadge(
      $("[data-stack-worker]"),
      state.health === "worker" ? "Not responding" : "Ready",
      state.health === "worker" ? "failed" : "good",
    );
    setBadge(
      $("[data-stack-web]"),
      state.releaseHealthy ? "Healthy" : "Needs recovery",
      state.releaseHealthy ? "good" : "failed",
    );
    setBadge(
      $("[data-overview-release-status]"),
      state.releaseHealthy ? "Healthy" : "Needs recovery",
      state.releaseHealthy ? "good" : "failed",
    );
    pipeline("[data-overview-pipeline]", [
      "done",
      "done",
      "done",
      state.releaseHealthy ? "done" : "failed",
    ]);
    setText(
      "[data-release-note]",
      state.releaseHealthy
        ? "Migration gate passed · sample release"
        : "Health verification needs operator recovery",
    );
    const workers = $("[data-worker-count]");
    workers.replaceChildren(
      document.createTextNode((state.health === "worker" ? 1 : 2) + " "),
      make("small", "/ 2 ready"),
    );
    setText(
      "[data-worker-note]",
      state.health === "worker"
        ? "Worker not responding · simulated"
        : "Celery worker + Beat · simulated",
    );
    const backupCount = $("[data-backup-count]");
    backupCount.replaceChildren(
      document.createTextNode(state.backups.length + " "),
      make(
        "small",
        "verified " + (state.backups.length === 1 ? "backup" : "backups"),
      ),
    );
    setText("[data-record-count]", state.records.toLocaleString("en-US"));
    const latest = state.backups.at(-1);
    setText(
      "[data-dataset-note]",
      state.records === latest.records
        ? "Current dataset matches backup #" +
            String(latest.id).padStart(3, "0") +
            "."
        : "Unsaved sample changes. The latest backup contains " +
            latest.records.toLocaleString("en-US") +
            " records.",
    );
    const activity = $("[data-history]");
    activity.replaceChildren();
    state.history.slice(0, 4).forEach((item) => {
      const row = make("div", undefined, "history-row");
      row.append(make("span", item.failed ? "!" : "✓", "history-symbol"));
      const copy = make("div", undefined, "history-copy");
      copy.append(make("strong", item.title), make("span", item.detail));
      row.append(copy, make("time", item.baseline ? "Sample" : "Just now"));
      activity.append(row);
    });
    const releases = $("[data-release-history]");
    releases.replaceChildren();
    state.releases.slice(0, 8).forEach((release) => {
      const row = make("tr");
      const name = make("td");
      name.append(
        make("strong", release.version),
        make("div", "Sample release", "table-detail"),
      );
      const outcome = make("td");
      outcome.append(make("span", release.outcome, "badge " + release.tone));
      row.append(name, outcome, make("td", release.compatibility));
      releases.append(row);
    });
    const backups = $("[data-backups]");
    backups.replaceChildren();
    state.backups
      .slice()
      .reverse()
      .forEach((backup) => {
        const row = make("tr");
        const identity = make("td");
        identity.append(
          make(
            "strong",
            "Sample backup #" + String(backup.id).padStart(3, "0"),
          ),
          make(
            "div",
            backup.records.toLocaleString("en-US") + " sample records",
            "table-detail",
          ),
        );
        const status = make("td");
        status.append(make("span", "Verified", "badge good"));
        row.append(identity, make("td", "PostgreSQL + media"), status);
        backups.append(row);
      });
  };
  const record = (title, detail, failed = false) => {
    state.history.unshift({ title, detail, failed });
    state.history = state.history.slice(0, 12);
    renderState();
  };
  const reset = () => {
    generation++;
    deployment = null;
    state = {
      release: "v1.8.2",
      releaseHealthy: true,
      nextRelease: 3,
      health: "healthy",
      records: 1240,
      backups: [{ id: 1, records: 1240 }],
      history: [
        {
          title: "Release v1.8.2 verified",
          detail: "Migration and health gates passed",
          baseline: true,
        },
        {
          title: "Recovery point created",
          detail: "Database and media stored together",
          baseline: true,
        },
      ],
      releases: [
        {
          version: "v1.8.2",
          outcome: "Succeeded",
          tone: "good",
          compatibility: "Compatible",
        },
      ],
    };
    lock(false);
    renderChecks();
    renderState();
    pipeline("[data-deploy-pipeline]", []);
    pipeline("[data-restore-pipeline]", []);
    setBadge($("[data-diagnostic-status]"), "5 checks passing", "good");
    setBadge($("[data-deploy-status]"), "Ready to try");
    $("#health-scenario").value = "healthy";
    $("#deploy-scenario").value = "success";
    message(
      "[data-diagnostic-result]",
      "Sample baseline: all checks passed. Run a scenario to explore the result.",
    );
    message(
      "[data-deploy-result]",
      "No deployment in progress. This action changes sample data only.",
    );
    message(
      "[data-restore-result]",
      "Sample restore only. No files, database records, or infrastructure are changed.",
    );
    note("Choose a scenario, then watch the release pass through each gate.");
    setText(
      "[data-deploy-lesson]",
      "Start with a successful deployment. Then choose “Migration failure” and compare how far the release gets.",
    );
    setText(
      "[data-diagnostic-lesson]",
      "Try a database or worker failure. The result points at the affected part of the stack, rather than giving you a generic red light.",
    );
    clearTimeout(toastTimer);
    $("[data-toast]").hidden = true;
  };
  const runHealth = async () => {
    if (busy) return;
    const token = ++generation,
      scenario = $("#health-scenario").value;
    lock(true);
    setBadge($("[data-diagnostic-status]"), "Checking…", "running");
    message(
      "[data-diagnostic-result]",
      "Running sample Django, database, migration, and worker checks…",
    );
    $("[data-checks]").replaceChildren(
      make("p", "Checking the sample application…"),
    );
    await delay(1100);
    if (token !== generation) return;
    state.health = scenario;
    renderChecks(scenario);
    setBadge(
      $("[data-diagnostic-status]"),
      scenario === "healthy"
        ? "5 checks passing"
        : scenario === "database"
          ? "1 failed · 1 not checked"
          : "1 check failed",
      scenario === "healthy" ? "good" : "failed",
    );
    message(
      "[data-diagnostic-result]",
      scenario === "healthy"
        ? "All five sample checks passed. The sample application is healthy."
        : "Diagnostic completed: the sample " +
            (scenario === "database"
              ? "database connection is unavailable."
              : "Celery worker did not respond."),
      scenario === "healthy" ? "" : "failed",
    );
    setText(
      "[data-diagnostic-lesson]",
      scenario === "database"
        ? "Next step: check PostgreSQL availability and runtime connection settings. Deploying a new web image will not repair an unreachable database."
        : scenario === "worker"
          ? "Next step: check the worker and Redis broker. A healthy web process does not mean background tasks are being consumed."
          : "All checks passed. You have a baseline to compare against before and after a release.",
    );
    record(
      "Health diagnostic " +
        (scenario === "healthy" ? "passed" : "found an issue"),
      scenario === "healthy"
        ? "5 sample checks passed"
        : scenario === "database"
          ? "Database connectivity failed"
          : "Worker response missing",
      scenario !== "healthy",
    );
    lock(false);
  };
  const finishDeployment = (
    version,
    outcome,
    tone,
    compatibility,
    result,
    lesson,
  ) => {
    state.releases.unshift({ version, outcome, tone, compatibility });
    state.releases = state.releases.slice(0, 8);
    setBadge($("[data-deploy-status]"), outcome, tone);
    message(
      "[data-deploy-result]",
      result,
      tone === "failed" ? "failed" : tone === "warning" ? "warning" : "",
    );
    setText("[data-deploy-lesson]", lesson);
    record(version + " · " + outcome, lesson, tone !== "good");
    deployment = null;
    lock(false);
  };
  const runDeploy = async () => {
    if (busy) return;
    const token = ++generation,
      scenario = $("#deploy-scenario").value,
      previous = state.release,
      previousHealthy = state.releaseHealthy,
      version = "v1.8." + state.nextRelease++;
    deployment = { previous, previousHealthy, version, activated: false };
    lock(true);
    pipeline("[data-deploy-pipeline]", []);
    setBadge($("[data-deploy-status]"), "Running", "running");
    note(
      "The new sample release is staged. Each gate must complete before advancing.",
    );
    setText(
      "[data-deploy-lesson]",
      "Watch where this release stops. The explanation will update when the scenario finishes.",
    );
    const phaseNames = [
      "Preparing immutable image",
      "Applying sample migrations",
      "Activating sample release",
      "Verifying application health",
    ];
    for (let index = 0; index < 4; index++) {
      if (token !== generation) return;
      pipeline(
        "[data-deploy-pipeline]",
        Array.from({ length: 4 }, (_, step) =>
          step < index ? "done" : step === index ? "running" : "",
        ),
      );
      message(
        "[data-deploy-result]",
        phaseNames[index] + " for " + version + "…",
      );
      await delay(800);
      if (token !== generation) return;
      if (index === 1 && scenario === "migration_fail") {
        pipeline("[data-deploy-pipeline]", ["done", "failed", "", ""]);
        note("Migration failed. Activation never started.", "failed");
        finishDeployment(
          version,
          "Migration blocked",
          "failed",
          "Not established",
          "Migration failure blocked activation. " +
            previous +
            " remains active.",
          "DjangoOps keeps the existing release active when migration fails. Review the migration; it does not guess reverse migrations.",
        );
        return;
      }
      if (index === 2) {
        deployment.activated = true;
        state.health = "healthy";
        state.release = version;
        renderState();
      }
      if (index === 3 && scenario !== "success") {
        pipeline("[data-deploy-pipeline]", ["done", "done", "done", "failed"]);
        if (scenario === "health_fail") {
          state.release = previous;
          state.releaseHealthy = previousHealthy;
          note(
            "Health failed, but the schema is compatible. Restore the previous application release.",
            "warning",
          );
          finishDeployment(
            version,
            "Rolled back",
            "good",
            "Compatible",
            "Health check failed. Safe rollback restored " + previous + ".",
            "A compatible schema permits application rollback. This restores the image and configuration, not reverse database migrations.",
          );
        } else {
          state.releaseHealthy = false;
          note(
            "Health failed. Schema compatibility is unknown; automatic rollback is blocked.",
            "failed",
          );
          finishDeployment(
            version,
            "Rollback blocked",
            "warning",
            "Unknown",
            "Rollback blocked. " +
              version +
              " needs operator recovery; automatic reversal could be unsafe.",
            "A previous image may not work with a changed schema. Inspect compatibility and choose explicit recovery, rather than reversing migrations blindly.",
          );
        }
        return;
      }
    }
    pipeline("[data-deploy-pipeline]", ["done", "done", "done", "done"]);
    state.releaseHealthy = true;
    note("All gates passed. The new sample release is active.");
    finishDeployment(
      version,
      "Succeeded",
      "good",
      "Compatible",
      "Release " +
        version +
        " is healthy and active in the sample environment.",
      "The new application became active only after migrations succeeded, then passed health verification.",
    );
  };
  const cancel = () => {
    if (!deployment) return;
    generation++;
    const { version, activated } = deployment;
    if (activated) {
      state.releaseHealthy = false;
      note(
        "Cancellation followed activation. Inspect the current release before retrying.",
        "warning",
      );
    } else
      note(
        "Request cancelled before activation. The previous release is still active.",
        "warning",
      );
    finishDeployment(
      version,
      "Cancelled",
      "warning",
      "Inspect before retry",
      activated
        ? "Sample request cancelled after activation. Inspect " +
            version +
            " before retrying; cancellation is not a rollback."
        : "Sample deployment cancelled before activation. " +
            state.release +
            " remains active.",
      "Cancellation stops the request. It does not guarantee that previously completed migrations or activation steps were undone.",
    );
  };
  const restore = async () => {
    if (busy) return;
    const token = ++generation,
      backup = { ...state.backups.at(-1) },
      preserved = state.records;
    lock(true);
    const phases = [
      "Validating sample database and media backup",
      "Preserving current sample state and stopping sample writers",
      "Restoring database and media from the sample recovery point",
      "Restarting sample writers and verifying Django health",
    ];
    for (let index = 0; index < 4; index++) {
      if (token !== generation) return;
      pipeline(
        "[data-restore-pipeline]",
        Array.from({ length: 4 }, (_, step) =>
          step < index ? "done" : step === index ? "running" : "",
        ),
      );
      message("[data-restore-result]", phases[index] + "…");
      await delay(650);
      if (token !== generation) return;
    }
    state.records = backup.records;
    const healthy = state.releaseHealthy && state.health === "healthy";
    pipeline("[data-restore-pipeline]", [
      "done",
      "done",
      "done",
      healthy ? "done" : "failed",
    ]);
    message(
      "[data-restore-result]",
      "Restored " +
        backup.records.toLocaleString("en-US") +
        " sample records + media. Preserved a simulated pre-restore copy of " +
        preserved.toLocaleString("en-US") +
        " records. " +
        (healthy
          ? "Writer and health checks passed."
          : "Health verification still needs attention; data restore does not repair an incompatible image or an unavailable service."),
      healthy ? "" : "warning",
    );
    record(
      "Sample backup #" + String(backup.id).padStart(3, "0") + " restored",
      healthy
        ? "Pre-restore state preserved; Django health verified"
        : "Data restored; remaining health issue needs operator attention",
      !healthy,
    );
    lock(false);
  };
  $$("[data-action]").forEach((button) =>
    button.addEventListener("click", () => {
      const action = button.dataset.action;
      if (action === "reset") {
        reset();
        toast("Demo reset. Your live workspace was not changed.");
      } else if (action === "health") runHealth();
      else if (action === "deploy") runDeploy();
      else if (action === "cancel") cancel();
      else if (action === "restore") restore();
      else if (action === "mutate" && !busy) {
        state.records += 3;
        record(
          "Sample dataset changed",
          "Added 3 sample records; the saved backup is unchanged",
        );
        toast(
          "Added 3 sample records. Try restoring the saved recovery point.",
        );
      } else if (action === "backup" && !busy) {
        if (state.backups.length >= 8) {
          toast("Eight sample backups created. Reset the demo to start again.");
          return;
        }
        const id = state.backups.length + 1;
        state.backups.push({ id, records: state.records });
        record(
          "Sample backup #" + String(id).padStart(3, "0") + " created",
          "Database and media stored as one recovery point",
        );
        toast(
          "Sample recovery point created. The next restore uses this backup.",
        );
      }
    }),
  );
  reset();
})();
</script>
