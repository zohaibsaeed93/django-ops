<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f8">
  <title>{% block title %}DjangoOps{% endblock %}</title>
  <script>
    // Apply the saved theme before painting, including on the sign-in screen.
    (() => {
      let preference;
      try { preference = localStorage.getItem("djangoops.theme"); } catch {}
      const theme = ["dark", "light"].includes(preference) ? preference :
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  {% include "controlplane/styles.html" %}
</head>
<body>
  {% include "controlplane/icons.html" %}
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% block content %}{% endblock %}
  {% include "controlplane/theme_script.html" %}
  {% block scripts %}{% endblock %}
</body>
</html>
